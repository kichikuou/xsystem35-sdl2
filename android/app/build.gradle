def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY')
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}
apply plugin: 'kotlin-android'

def sdlVersion = '3.4.16'
def sdlArchiveUrl = "https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL3-devel-${sdlVersion}-android.zip"
def sdlArchiveSha256 = 'e1da8d9298471ea4ab8c6d48a804c0ac5415f35f30fcf7eba61aa7357e165765'
def sdlAarName = "SDL3-${sdlVersion}.aar"
def sdlAarSha256 = '03710fc7b49cc070551446841a843840fabf2aaaaa3043cd5739292a55e4e61c'
def aarsDir = file('aars')
def assetsLicensesDir = file('src/main/assets/licenses')
def aarFile = new File(aarsDir, sdlAarName)
def licenseFile = new File(assetsLicensesDir, 'SDL')

def sha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int n = input.read(buffer); n >= 0; n = input.read(buffer)) {
            digest.update(buffer, 0, n)
        }
    }
    digest.digest().encodeHex().toString()
}

if (!aarFile.exists() || !licenseFile.exists()) {
    logger.lifecycle("Downloading ${sdlAarName} ...")
    def archive = File.createTempFile('sdl3-android', '.zip')
    try {
        new URL(sdlArchiveUrl).withInputStream { input ->
            archive.withOutputStream { it << input }
        }
        if (sha256(archive) != sdlArchiveSha256) {
            throw new GradleException("Checksum mismatch for ${sdlArchiveUrl}")
        }
        aarsDir.mkdirs()
        assetsLicensesDir.mkdirs()
        copy {
            from zipTree(archive)
            include sdlAarName
            into aarsDir
        }
        copy {
            from zipTree(archive)
            include 'LICENSE.txt'
            into assetsLicensesDir
            rename 'LICENSE.txt', 'SDL'
        }
    } finally {
        archive.delete()
    }
}
if (!aarFile.exists() || sha256(aarFile) != sdlAarSha256) {
    throw new GradleException("Checksum mismatch for ${aarFile}")
}

android {
    if (buildAsApplication) {
        namespace "io.github.kichikuou.xsystem35"
    }
    buildFeatures {
        prefab true
    }
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 36
        versionName "2.20.0" + gitRevision()
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DXSYSTEM35_SDL_VERSION=3"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    signingConfigs {
        release {
            storeFile rootProject.file('keystore.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (rootProject.file('keystore.jks').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        aaptOptions {
            // Disable asset compression for fonts.
            // Without this, text rendering will be very slow.
            noCompress 'ttf', 'otf'
        }
        externalNativeBuild {
            cmake {
                version '3.22.1'
                path 'jni/CMakeLists.txt'
            }
        }
       
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar"
                    output.outputFile = new File(outputFile.parent, fileName)
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files(aarFile)
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    testImplementation 'junit:junit:4.13.2'
}

static String gitRevision() {
    ' (git ' + "git rev-parse --short HEAD".execute().text.trim() + ')'
}
